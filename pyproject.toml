[project]
name = "overpaid-or-bargain"
version = "0.1.0"
description = "Overpaid or bargain? Analysis of the 2026 summer transfer window"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "beautifulsoup4>=4.15.0",
    "lxml>=6.1.3",
    "matplotlib>=3.11.2",
    "pandas>=3.0.6",
    "plotly>=7.1.0",
    "pyarrow>=25.0.1",
    "pyyaml>=6.0.3",
    "requests>=2.34.2",
    "soccerdata>=1.9.1",
    "tqdm>=4.70.1",
]

[project.scripts]
pechincha = "pechincha.cli:main"

[build-system]
requires = ["uv_build>=0.8.17,<0.10.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "pechincha"

[tool.pytest.ini_options]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
